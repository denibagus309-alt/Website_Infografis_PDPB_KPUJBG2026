<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Upload Rekap Excel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
    background:#081b33;
    color:white;
    font-family:Segoe UI;
}

.card{
    margin-top:30px;
    background:#102f5c;
    border-radius:15px;
    color:white;
}

table{
    background:white;
    color:black;
}

</style>

</head>

<body>

<div class="container">

<div class="card shadow">

<div class="card-header">

<h3>Upload Data Rekap Excel</h3>

</div>

<div class="card-body">

<input
type="file"
id="excelFile"
accept=".xlsx,.xlsm,.xls"
class="form-control">

<br>

<button
class="btn btn-info"
onclick="uploadExcel()">

Upload Data

</button>

</div>

</div>

<br>

<div class="table-responsive">

<table
id="excelTable"
class="table table-bordered table-striped">

<thead></thead>

<tbody></tbody>

</table>

</div>

</div>

<script>

function uploadExcel(){

const file=document.getElementById("excelFile").files[0];

if(!file){

alert("Silakan pilih file Excel.");

return;

}

const reader=new FileReader();

reader.onload=function(e){

const data=new Uint8Array(e.target.result);

const workbook=XLSX.read(data,{type:'array'});

const sheetName=workbook.SheetNames[0];

const sheet=workbook.Sheets[sheetName];

const json=XLSX.utils.sheet_to_json(sheet,{header:1});

buatTabel(json);

}

reader.readAsArrayBuffer(file);

}

function buatTabel(data){

const thead=document.querySelector("#excelTable thead");

const tbody=document.querySelector("#excelTable tbody");

thead.innerHTML="";

tbody.innerHTML="";

let head="<tr>";

data[0].forEach(col=>{

head+="<th>"+col+"</th>";

});

head+="</tr>";

thead.innerHTML=head;

for(let i=1;i<data.length;i++){

let row="<tr>";

data[i].forEach(col=>{

row+="<td>"+col+"</td>";

});

row+="</tr>";

tbody.innerHTML+=row;

}

}

</script>

</body>
