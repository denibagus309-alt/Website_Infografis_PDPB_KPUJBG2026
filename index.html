<!doctype html><html><body><h1>KPU KABUPATEN JOMBANG</h1></body></html>
<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PDPB Dashboard KPU Jombang</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{

background:#07142b;

font-family:Segoe UI;

color:white;

}

.sidebar{

position:fixed;

width:250px;

height:100vh;

background:#0b2344;

padding-top:20px;

box-shadow:5px 0 15px rgba(0,0,0,.4);

}

.sidebar h3{

text-align:center;

font-weight:bold;

color:#00e5ff;

margin-bottom:30px;

}

.sidebar a{

display:block;

padding:15px;

color:white;

text-decoration:none;

transition:.3s;

}

.sidebar a:hover{

background:#00bcd4;

padding-left:30px;

}

.content{

margin-left:260px;

padding:20px;

}

.topbar{

height:70px;

background:#102f5c;

border-radius:15px;

padding:15px;

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

.card-dashboard{

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.1);

backdrop-filter:blur(15px);

border-radius:20px;

padding:20px;

transition:.3s;

}

.card-dashboard:hover{

transform:translateY(-5px);

box-shadow:0 0 20px cyan;

}

.number{

font-size:34px;

font-weight:bold;

color:#00e5ff;

}

canvas{

background:white;

border-radius:15px;

padding:10px;

}

</style>

</head>

<body>

<div class="sidebar">

<h3>PDPB 2026</h3>

<a href="#"><i class="fa fa-home"></i> Dashboard</a>

<a href="#"><i class="fa fa-users"></i> Penduduk</a>

<a href="#"><i class="fa fa-chart-column"></i> Statistik</a>

<a href="#"><i class="fa fa-map"></i> Kecamatan</a>

<a href="#"><i class="fa fa-file"></i> Laporan</a>

<a href="#"><i class="fa fa-gear"></i> Pengaturan</a>

</div>

<div class="content">

<div class="topbar">

<h4>Dashboard Kependudukan Kabupaten Jombang</h4>

<div>

<i class="fa fa-calendar"></i>

<span id="tanggal"></span>

</div>

</div>

<div class="row g-4">

<div class="col-md-3">

<div class="card-dashboard">

<h6>Total Penduduk</h6>

<div class="number">1.254.210</div>

</div>

</div>

<div class="col-md-3">

<div class="card-dashboard">

<h6>Laki-Laki</h6>

<div class="number">620.410</div>

</div>

</div>

<div class="col-md-3">

<div class="card-dashboard">

<h6>Perempuan</h6>

<div class="number">633.800</div>

</div>

</div>

<div class="col-md-3">

<div class="card-dashboard">

<h6>KK</h6>

<div class="number">382.120</div>

</div>

</div>

</div>

<br>

<div class="row">

<div class="col-md-8">

<div class="card-dashboard">

<canvas id="barChart"></canvas>

</div>

</div>

<div class="col-md-4">

<div class="card-dashboard">

<canvas id="pieChart"></canvas>

</div>

</div>

</div>

</div>

<script>

document.getElementById("tanggal").innerHTML=new Date().toLocaleDateString("id-ID");

new Chart(document.getElementById("barChart"),{

type:'bar',

data:{

labels:["Jan","Feb","Mar","Apr","Mei","Jun"],

datasets:[{

label:"Penduduk",

data:[120,180,160,220,250,280],

backgroundColor:"#00BCD4"

}]

}

});

new Chart(document.getElementById("pieChart"),{

type:'doughnut',

data:{

labels:["Laki-laki","Perempuan"],

datasets:[{

data:[620410,633800],

backgroundColor:["#00BCD4","#FF4081"]

}]

}

});

</script>

</body>

</html>
