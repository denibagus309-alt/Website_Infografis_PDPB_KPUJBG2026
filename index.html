<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Infografis Penduduk</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Dashboard Data Penduduk</h1>
</head>

<body>

<header>

<h1>INFOGRAFIS DATA PENDUDUK</h1>

</header>

<div class="menu">

<button onclick="exportExcel()">Export Excel</button>

<button onclick="exportPDF()">Export PDF</button>

<button onclick="window.print()">Cetak</button>

<input type="file" id="excel">

</div>

<div class="kpi">

<div class="box">

<h2 id="total">0</h2>

<p>Total Penduduk</p>

</div>

<div class="box">

<h2 id="lk">0</h2>

<p>Laki-laki</p>

</div>

<div class="box">

<h2 id="pr">0</h2>

<p>Perempuan</p>

</div>

</div>

<div class="chart">

<canvas id="jkChart"></canvas>

</div>

<table id="tbl">

<thead>

<tr>

<th>NIK</th>

<th>Nama</th>

<th>JK</th>

<th>Umur</th>

<th>Pendidikan</th>

<th>Pekerjaan</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

<script src="js/app.js"></script>

</body>

</html>
