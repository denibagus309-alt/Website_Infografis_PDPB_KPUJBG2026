<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Infografis Penduduk</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    
</head>

<body>

    <h1>Dashboard Data Penduduk</h1>
    
</head>

<body>

<header>

<h1>INFOGRAFIS DATA PENDUDUK</h1>

</header>

<div class="menu">

<button onclick="exportExcel()">Export Excel</button>

<button onclick="exportPDF()">Export PDF</button>

<button onclick="window.print()">Cetak</button>

<input type="file" id="excel">

</div>

<div class="kpi">

<div class="box">

<h2 id="total">0</h2>

<p>Total Penduduk</p>

</div>

<div class="box">

<h2 id="lk">0</h2>

<p>Laki-laki</p>

</div>

<div class="box">

<h2 id="pr">0</h2>

<p>Perempuan</p>

</div>

</div>

<div class="chart">

<canvas id="jkChart"></canvas>

</div>

<table id="tbl">

<thead>

<tr>

<th>NIK</th>

<th>Nama</th>

<th>JK</th>

<th>Umur</th>

<th>Pendidikan</th>

<th>Pekerjaan</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

<script src="js/app.js"></script>


<let data=[];>

<function tampil(){

let tb=document.querySelector("#tbl tbody");

<tb.innerHTML="";

<let lk=0;

let pr=0;

data.forEach(x=>{

<tb.innerHTML+=`

<tr>

<td>{x.nik}</td>

<td>{x.nama}</td>

<td>{x.jk}</td>

<td>{x.umur}</td>

<td>{x.pendidikan}</td>

<td>{x.pekerjaan}</td>

</tr>

<if(x.jk=="Laki-laki")

lk++;

else

pr++;

});

document.getElementById("total").innerHTML=data.length;

document.getElementById("lk").innerHTML=lk;

document.getElementById("pr").innerHTML=pr;

<grafik(lk,pr);

}

function grafik(l,p){

new Chart(document.getElementById("jkChart"),{

<type:"pie",

<data:{

labels:["Laki-laki","Perempuan"],

<datasets:[{

data:[l,p]

}]

}

});

}

function exportExcel(){

let wb=XLSX.utils.book_new();

let ws=XLSX.utils.json_to_sheet(data);

XLSX.utils.book_append_sheet(wb,ws,"Penduduk");

<XLSX.writeFile(wb,"Penduduk.xlsx");

}

<async function exportPDF(){

const {jsPDF}=window.jspdf;

let pdf=new jsPDF();

pdf.text("Laporan Data Penduduk",20,20);

<let y=40;

data.forEach(x=>{

<pdf.text(

`${x.nik} ${x.nama} ${x.jk}`,

20,

y

);

y+=10;

});

pdf.save("Laporan.pdf");

}


<body{

margin:0;

font-family:arial;

background:#f4f6f8;

}

header{

background:#00695c;

color:white;

padding:20px;

text-align:center;

}

.menu{

padding:20px;

}

button{

padding:10px 20px;

margin:5px;

}

.kpi{

display:flex;

gap:20px;

padding:20px;

}

.box{

background:white;

flex:1;

padding:20px;

text-align:center;

border-radius:10px;

box-shadow:0 0 10px #ccc;

}

.chart{

width:500px;

margin:auto;

}

table{

width:100%;

border-collapse:collapse;

background:white;

}

th{

background:#00695c;

color:white;

}

td,th{

padding:10px;

border:1px solid #ddd;

}
    
</body>

</html>
