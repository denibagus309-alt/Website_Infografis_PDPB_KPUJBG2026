<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aplikasi Infografis Data Penduduk</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

    <!-- Background -->
    <div class="bg-animation"></div>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-chart-column"></i>
            <h2>SI-PENDUDUK</h2>
        </div>

        <ul>

            <li class="active">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </li>

            <li>
                <i class="fa-solid fa-users"></i>
                Data Penduduk
            </li>

            <li>
                <i class="fa-solid fa-chart-pie"></i>
                Statistik
            </li>

            <li>
                <i class="fa-solid fa-file-pdf"></i>
                Laporan
            </li>

            <li>
                <i class="fa-solid fa-gear"></i>
                Pengaturan
            </li>

        </ul>

    </aside>

    <!-- Main -->
    <main class="content">

        <!-- Header -->
        <header>

            <div>
                <h1>Dashboard Infografis Data Penduduk</h1>
                <p>Sistem Informasi Kependudukan Berbasis Web</p>
            </div>

            <div class="aksi">

                <button onclick="exportExcel()">
                    <i class="fa-solid fa-file-excel"></i>
                    Excel
                </button>

                <button onclick="exportPDF()">
                    <i class="fa-solid fa-file-pdf"></i>
                    PDF
                </button>

                <button onclick="window.print()">
                    <i class="fa-solid fa-print"></i>
                    Cetak
                </button>

            </div>

        </header>

        <!-- KPI -->
        <section class="kpi">

            <div class="box">

                <h2 id="total">0</h2>

                <p>Total Penduduk</p>

            </div>

            <div class="box">

                <h2 id="lk">0</h2>

                <p>Laki-laki</p>

            </div>

            <div class="box">

                <h2 id="pr">0</h2>

                <p>Perempuan</p>

            </div>

            <div class="box">

                <h2 id="kk">0</h2>

                <p>Kepala Keluarga</p>

            </div>

        </section>

        <!-- Menu -->
        <section class="toolbar">

            <input
                type="text"
                id="cari"
                placeholder="Cari NIK atau Nama..."
                onkeyup="cariData()">

            <input
                type="file"
                id="excel"
                accept=".xlsx,.xls">

            <button onclick="importExcel()">
                Import Excel
            </button>

        </section>

        <!-- Grafik -->
        <section class="grafik">

            <div class="card">

                <canvas id="jkChart"></canvas>

            </div>

            <div class="card">

                <canvas id="umurChart"></canvas>

            </div>

        </section>

        <!-- Tabel -->
        <section class="table-area">

            <table id="tbl">

                <thead>

                    <tr>

                        <th>NIK</th>

                        <th>Nama</th>

                        <th>JK</th>

                        <th>Umur</th>

                        <th>Pendidikan</th>

                        <th>Pekerjaan</th>

                        <th>Aksi</th>

                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </section>

    </main>

    <!-- Javascript -->
    <script src="js/storage.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/import.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
